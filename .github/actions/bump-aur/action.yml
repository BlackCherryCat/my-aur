# .github/actions/bump-aur/action.yml
name: Bump AUR PKGBUILD
description: Download, checksum, update PKGBUILD + .SRCINFO, commit, push
inputs:
  version:
    required: true
  url:
    required: true
  dir:
    required: true
  pkgbuild:
    required: true
  srcinfo:
    required: true
runs:
  using: composite
  steps:
    - name: Checksum
      id: sha
      shell: bash
      run: |
        tmp="$(mktemp)"
        curl -fL -o "$tmp" "${{ inputs.url }}"
        echo "sha=$(sha256sum "$tmp" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
        rm -f "$tmp"
    - name: Update files
      shell: bash
      run: |
        sed -i "s/^pkgver=.*/pkgver='${{ inputs.version }}'/" ${{ inputs.pkgbuild }}
        sed -i "s/^sha256sums=.*/sha256sums=('${{ steps.sha.outputs.sha }}')/" ${{ inputs.pkgbuild }}
        sudo -u builder makepkg --printsrcinfo -D ${{ inputs.dir }} > "${{ inputs.srcinfo }}"
    - name: Commit & push
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "${{ inputs.pkgbuild }}" "${{ inputs.srcinfo }}"
        git commit -m "Update to ${{ inputs.version }}"
        git push origin HEAD
