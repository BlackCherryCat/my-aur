name: mindustry-sdl3-bin

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mindustry-sdl3-bin
  cancel-in-progress: true

jobs:
  update:
    outputs:
      out_of_date: ${{ steps.check.outputs.out_of_date }}
    runs-on: ubuntu-latest
    container: archlinux/archlinux:latest
    steps:
      - name: Setup
        run: |
          pacman -Syu --noconfirm git devtools curl jq openssh pacman-contrib archlinux-keyring
          sudo useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" | sudo tee -a /etc/sudoers
          git config --system --add safe.directory "${GITHUB_WORKSPACE}"
          pacman -S --noconfirm --needed \
            jdk17-openjdk patch libicns \
            alsa-lib hicolor-icon-theme

      - uses: actions/checkout@v7

      - name: Get latest Anuken/Mindustry release
        id: latest
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          owner: Anuken
          repo: Mindustry
          excludes: prerelease, draft

      - name: Check if out of date
        id: check
        run: |
          ver="${{ steps.latest.outputs.release }}"
          ver="${ver#v}"
          cur="$(sed -n 's/^pkgver=//p' mindustry-sdl3-bin/PKGBUILD | tr -d ' \"')"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          if [ "$ver" != "$cur" ]; then echo "out_of_date=true" >> "$GITHUB_OUTPUT"; else echo "out_of_date=false" >> "$GITHUB_OUTPUT"; fi

      - name: Bump version, checksums and build
        if: steps.check.outputs.out_of_date == 'true'
        working-directory: mindustry-sdl3-bin
        run: |
          set -euo pipefail
          version="${{ steps.check.outputs.version }}"
          sudo chown -R builder:builder "${GITHUB_WORKSPACE}"
          sed -i -E "s|^pkgver=.*|pkgver=${version}|" PKGBUILD
          sudo -u builder updpkgsums
          sudo -u builder makepkg --printsrcinfo > .SRCINFO
          sudo -u builder makepkg --printsrcinfo | diff - .SRCINFO
          sudo -u builder makepkg --noconfirm

      - name: Commit & push to GitHub
        if: steps.check.outputs.out_of_date == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.check.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mindustry-sdl3-bin/PKGBUILD mindustry-sdl3-bin/.SRCINFO
          git commit -m "Update to ${version}"
          git push origin HEAD

  aur_push:
    needs: update
    if: needs.update.outputs.out_of_date == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: mindustry-sdl3-bin
          asset_dir: "./mindustry-sdl3-bin"
          commit_username: github-actions[bot]
          commit_email: 41898282+github-actions[bot]@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: Update to ${{ github.ref_name }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
