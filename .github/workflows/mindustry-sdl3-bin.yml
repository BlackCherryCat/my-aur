name: mindustry-sdl3-bin

# Builds the SDL3 jar (with the SDL3 patches), publishes it as a GitHub
# Release asset on tag v<pkgver>, then publishes the AUR package via KSX
# github-actions-deploy-aur. If the release asset for v<pkgver> already
# exists, the build is skipped and the existing asset is reused (the jar sha
# is recomputed from it). The deploy action clones the AUR package into a
# temp dir, mirrors asset_dir=./mindustry-sdl3-bin into it, runs makepkg
# (which downloads the jar from the release-asset PKGBUILD source), and
# uploads the .pkg.tar to AUR (skips the commit when nothing changed).
#
# Everything is one job so the deploy sees the jar that was just published.
# The PKGBUILD jar sha256sums are updated in the working tree (NOT pushed):
# pushing would re-trigger this workflow and race/cancel this run before the
# KSX deploy step runs. KSX reads the PKGBUILD from the working tree here.
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # safety net: if the jar release asset was deleted, rebuild + republish +
    # redeploy; otherwise reuse the existing asset (KSX skips the AUR commit
    # when nothing changed).
    - cron: '0 6 * * *'

permissions:
  contents: write

concurrency:
  group: mindustry-sdl3-bin
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pkgver from PKGBUILD
        id: pkgver
        shell: bash
        working-directory: mindustry-sdl3-bin
        run: echo "pkgver=$(grep -m1 '^pkgver=' PKGBUILD | cut -d= -f2 | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Skip if the release asset already exists
        id: check
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.pkgver.outputs.pkgver }}"
          name="mindustry-sdl3-bin-${ver}.jar"
          mkdir -p build-src
          # Reuse the published asset if it exists (also fetched for the sha
          # step); otherwise the build steps below build + publish it.
          if curl -sfL -o "build-src/${name}" \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${ver}/${name}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release asset '${name}' already exists; skipping build."
          else
            rm -f "build-src/${name}"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare source (clone v<ver> + apply patches)
        if: steps.check.outputs.skip != 'true'
        shell: bash
        working-directory: mindustry-sdl3-bin
        run: |
          set -euo pipefail
          ver="${{ steps.pkgver.outputs.pkgver }}"
          cd "$GITHUB_WORKSPACE"
          rm -rf build-src
          mkdir build-src && cd build-src
          git clone --depth 1 --branch v${ver} https://github.com/Anuken/Mindustry.git Mindustry
          git clone --depth 1 --branch v${ver} https://github.com/Anuken/Arc.git Arc
          cd Mindustry
          ln -sf ../Arc Arc

          # Mindustry needs archash=v<ver>; LWJGL's released 3.4.2 (Maven Central)
          # not the -SNAPSHOT, so patch Arc to use the Central version.
          sed -E -e '/archash/s&archash=.*$&archash=v${ver}&' -i gradle.properties
          sed -i 's/versions.lwjgl = "3.4.2-SNAPSHOT"/versions.lwjgl = "3.4.2"/' Arc/build.gradle

          patch -Np1 < "$GITHUB_WORKSPACE/mindustry-sdl3-bin/0001-mindustry-use-sdl3-backend.patch"
          ( cd ../Arc && patch -Np1 < "$GITHUB_WORKSPACE/mindustry-sdl3-bin/0002-arc-sdl3-preserve-wheel-delta.patch" )

      - name: Build SDL3 jar
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd build-src/Mindustry
          ./gradlew --warning-mode=all --no-daemon dist -Pbuildversion="${{ steps.pkgver.outputs.pkgver }}" desktop:dist
          # name the jar after the release asset the PKGBUILD expects
          mv desktop/build/libs/Mindustry.jar \
             "desktop/build/libs/mindustry-sdl3-bin-${{ steps.pkgver.outputs.pkgver }}.jar"

      - name: Compute jar sha256
        id: sha
        run: |
          set -euo pipefail
          name="mindustry-sdl3-bin-${{ steps.pkgver.outputs.pkgver }}.jar"
          if [[ "${{ steps.check.outputs.skip }}" == "true" ]]; then
            jar="build-src/${name}" # fetched by the check step
          else
            jar="build-src/Mindustry/desktop/build/libs/${name}"
          fi
          echo "sha256=$(sha256sum "$jar" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Publish release asset on tag v${{ steps.pkgver.outputs.pkgver }}
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkgver.outputs.pkgver }}
          files: build-src/Mindustry/desktop/build/libs/mindustry-sdl3-bin-${{ steps.pkgver.outputs.pkgver }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update PKGBUILD jar sha256sums
        shell: bash
        working-directory: mindustry-sdl3-bin
        run: |
          set -euo pipefail
          ver="${{ steps.pkgver.outputs.pkgver }}"
          jar_sha="${{ steps.sha.outputs.sha256 }}"
          sed -i "/^sha256sums=/s|.*|sha256sums=('${jar_sha}'   # mindustry-sdl3-bin-${ver}.jar (compiled SDL3, published as a release asset)|" PKGBUILD

      - name: Publish AUR package (KSX github-actions-deploy-aur)
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: mindustry-sdl3-bin
          asset_dir: "./mindustry-sdl3-bin"
          commit_username: github-actions[bot]
          commit_email: 41898282+github-actions[bot]@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          commit_message: Update to ${{ steps.pkgver.outputs.pkgver }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
